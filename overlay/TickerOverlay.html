<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>LazerGuanas Ticker</title>
<style>
  :root {
    --accent: #7cc44a;
    --bg: rgba(10, 20, 16, 0.86);
    --border: #4a7c3a;
    --label: #a8c488;
    --value: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: transparent; overflow: hidden;
    font-family: 'Segoe UI', 'Bebas Neue', Arial, sans-serif;
  }
  /* Bottom strip; the OBS source rectangle sets the overall size, the ?size param the text. */
  #wrap {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: center; align-items: flex-end;
    padding: 0.5em; overflow: hidden;
  }
  #wrap.top { bottom: auto; top: 0; align-items: flex-start; }
  #wrap.scroll { justify-content: flex-start; padding-left: 0; padding-right: 0; }
  #bar {
    display: inline-flex; align-items: stretch; gap: 0;
    background: var(--bg);
    border: 2px solid var(--border); border-radius: 0.6em;
    box-shadow: 0 0.3em 1em rgba(0, 0, 0, 0.55);
    overflow: hidden; max-width: 100%;
    font-size: 20px;                 /* base size — scaled by ?size; children use em */
    will-change: transform;
  }
  #wrap.scroll #bar { max-width: none; flex: 0 0 auto; border-radius: 0; border-width: 2px 0; }
  .slot {
    display: flex; align-items: center; gap: 0.45em;
    padding: 0.5em 1em; white-space: nowrap; position: relative;
  }
  .slot + .slot { border-left: 1px solid rgba(124, 196, 74, 0.28); }
  .slot .ic { font-size: 1.1em; line-height: 1; }
  .slot .txt { display: flex; flex-direction: column; line-height: 1.15; }
  .slot .lab {
    font-size: 0.55em; font-weight: 700; letter-spacing: 0.06em;
    color: var(--label); text-transform: uppercase;
  }
  #bar.nolabels .lab { display: none; }
  #bar.nolabels .val { font-size: 1em; }
  .slot .val {
    font-size: 1em; font-weight: 700; color: var(--value);
    max-width: 13em; overflow: hidden; text-overflow: ellipsis;
  }
  #wrap.scroll .val { max-width: none; }   /* full names while scrolling */
  .slot .val .amt { color: var(--accent); font-size: 0.75em; margin-left: 0.3em; }
  .slot .val.empty { color: #6f8560; font-weight: 600; }
  @keyframes bump {
    0% { transform: scale(1); }
    30% { transform: scale(1.14); color: var(--accent); }
    100% { transform: scale(1); }
  }
  .slot.bump .val { animation: bump 0.6s ease; }
  .slot.bump { box-shadow: inset 0 0 0 999px rgba(124, 196, 74, 0.10); }
</style>
</head>
<body>
  <div id="wrap"><div id="bar"></div></div>

<script>
(function () {
  "use strict";
  var DEF = {
    sub:    { icon: "⭐", label: "Newest Sub" },
    gift:   { icon: "🎁", label: "Latest Gift" },
    follow: { icon: "➕", label: "Newest Follower" },
    raid:   { icon: "⚔️", label: "Latest Raid" },
    redeem: { icon: "✨", label: "Last Redeem" },
    clip:   { icon: "🎬", label: "Last Clip" }
  };
  var params = new URLSearchParams(location.search);

  var kinds = (params.get("kinds") || "sub,follow,gift")
    .split(",").map(function (k) { return k.trim().toLowerCase(); })
    .filter(function (k) { return DEF[k]; });
  if (!kinds.length) kinds = ["sub", "follow", "gift"];

  // ?size = base text size in px (default 20). Scales the whole bar (children use em).
  var size = parseInt(params.get("size"), 10);
  if (!(size >= 8 && size <= 120)) size = 20;

  // ?scroll = off | rtl (right→left) | ltr (left→right).  ?speed = pixels/second.
  var scroll = (params.get("scroll") || "off").toLowerCase();
  if (scroll === "left" || scroll === "leftward") scroll = "rtl";
  if (scroll === "right" || scroll === "rightward") scroll = "ltr";
  if (scroll !== "rtl" && scroll !== "ltr") scroll = "off";
  var speed = parseInt(params.get("speed"), 10);
  if (!(speed >= 5 && speed <= 1000)) speed = 60;

  // ?pos = bottom | top   ?bg = 0..100 (bar opacity)   ?accent = hex   ?labels = 0|1
  var pos = (params.get("pos") || "bottom").toLowerCase();
  var bg = parseInt(params.get("bg"), 10);
  if (!(bg >= 0 && bg <= 100)) bg = 86;
  var accent = params.get("accent");
  if (accent && /^#?[0-9a-fA-F]{6}$/.test(accent)) {
    if (accent[0] !== "#") accent = "#" + accent;
    document.documentElement.style.setProperty("--accent", accent);
    document.documentElement.style.setProperty("--label", accent);
    document.documentElement.style.setProperty("--border", accent);
  }
  var showLabels = params.get("labels") !== "0";

  var wrap = document.getElementById("wrap");
  var bar = document.getElementById("bar");
  bar.style.fontSize = size + "px";
  if (pos === "top") wrap.classList.add("top");
  if (!showLabels) bar.classList.add("nolabels");
  bar.style.background = "rgba(10, 20, 16, " + (bg / 100) + ")";

  var slots = {};
  kinds.forEach(function (kind) {
    var d = DEF[kind];
    var slot = document.createElement("div");
    slot.className = "slot";
    var ic = document.createElement("span"); ic.className = "ic"; ic.textContent = d.icon;
    var txt = document.createElement("span"); txt.className = "txt";
    var lab = document.createElement("span"); lab.className = "lab"; lab.textContent = d.label;
    var val = document.createElement("span"); val.className = "val empty"; val.textContent = "—";
    txt.appendChild(lab); txt.appendChild(val);
    slot.appendChild(ic); slot.appendChild(txt);
    bar.appendChild(slot);
    slots[kind] = { el: slot, val: val };
  });

  function setSlot(kind, item, animate) {
    var s = slots[kind];
    if (!s || !item) return;
    var name = (item.user || "").toString().trim() || "Someone";
    s.val.classList.remove("empty");
    if (kind === "gift" && item.amount > 0) {
      s.val.innerHTML = "";
      s.val.appendChild(document.createTextNode(name));
      var amt = document.createElement("span"); amt.className = "amt";
      amt.textContent = item.amount + " 🪙";
      s.val.appendChild(amt);
    } else {
      s.val.textContent = name;
    }
    if (animate && scroll === "off") {   // the bump animation fights the marquee transform
      s.el.classList.remove("bump");
      void s.el.offsetWidth;
      s.el.classList.add("bump");
    }
  }

  // ---- Marquee (optional) ----
  if (scroll !== "off") {
    wrap.classList.add("scroll");
    var x = null, last = null, raf = 0;
    function frame(t) {
      var wrapW = wrap.offsetWidth, barW = bar.offsetWidth;
      if (x === null) x = (scroll === "rtl") ? wrapW : -barW;
      if (last === null) last = t;
      var dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (scroll === "rtl") { x -= speed * dt; if (x < -barW) x = wrapW; }
      else { x += speed * dt; if (x > wrapW) x = -barW; }
      bar.style.transform = "translateX(" + Math.round(x) + "px)";
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
  }

  function onFrame(raw) {
    var d;
    try { d = JSON.parse(raw); } catch (e) { return; }
    if (!d || typeof d.type !== "string") return;
    if (d.type === "snapshot") {
      var latest = d.activityLatest || {};
      if ((!latest || !Object.keys(latest).length) && Array.isArray(d.activity)) {
        latest = {};
        for (var i = 0; i < d.activity.length; i++) { var it = d.activity[i]; if (it && it.kind) latest[it.kind] = it; }
      }
      kinds.forEach(function (k) { if (latest[k]) setSlot(k, latest[k], false); });
    } else if (d.type === "activity" && d.item && d.item.kind) {
      setSlot(d.item.kind, d.item, true);
    }
  }

  // ---- WebSocket (same server as the other overlays) ----
  function wsUrl() {
    if (location.protocol === "http:" || location.protocol === "https:") {
      return (location.protocol === "https:" ? "wss:" : "ws:") + "//" + location.host + "/ws";
    }
    return "ws://localhost:3620/ws";
  }
  var ws = null, retry = null;
  function schedule() { if (!retry) retry = setTimeout(function () { retry = null; connect(); }, 1500); }
  function connect() {
    try { ws = new WebSocket(wsUrl()); } catch (e) { schedule(); return; }
    ws.onopen = function () { try { ws.send(JSON.stringify({ type: "hello", client: "ticker" })); } catch (e) {} };
    ws.onmessage = function (ev) { onFrame(ev.data); };
    ws.onclose = function () { schedule(); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  connect();
})();
</script>
</body>
</html>
